<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wallet setup guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #2563EB;
    --primary-dark: #1D4ED8;
    --primary-soft: #EFF6FF;
    --accent: #F59E0B;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
    --text: #111827;
    --text2: #4B5563;
    --text3: #9CA3AF;
    --line: #E5E7EB;
    --card: #FFFFFF;
    --page: #F3F4F6;
    --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-urdu: "Noto Nastaliq Urdu", Tahoma, serif;
    --font-latin: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    --gg-green: #34A853;
    --field: #F3F6FA;
    --faint: #9CA3AF;
  }

  html[lang="ur"] { --font: var(--font-urdu); }

  body {
    font-family: var(--font);
    font-size: 0.28rem;
    line-height: 1.55;
    color: var(--text);
    background: var(--page);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    touch-action: manipulation;
  }
  html[lang="ur"] body { line-height: 1.85; }

  .h5 {
    width: 100%;
    max-width: 7.5rem;
    margin: 0 auto;
    min-height: 100dvh;
    padding-bottom: calc(0.4rem + env(safe-area-inset-bottom, 0px));
  }

  /* Top bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: calc(0.88rem + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) 0.24rem 0;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .title {
    flex: 1;
    text-align: center;
    font-size: 0.32rem;
    font-weight: 700;
    padding: 0 0.16rem;
  }
  .topbar .back {
    width: 0.72rem;
    height: 0.72rem;
    border: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  html[lang="ur"] .topbar .back svg { transform: scaleX(-1); }
  .lang {
    display: flex;
    gap: 0.04rem;
    background: var(--page);
    border-radius: 999px;
    padding: 0.04rem;
  }
  .lang button {
    border: 0;
    background: transparent;
    min-width: 0.56rem;
    height: 0.52rem;
    padding: 0 0.12rem;
    border-radius: 999px;
    font-size: 0.22rem;
    font-weight: 700;
    font-family: inherit;
    color: var(--text2);
  }
  .lang button[aria-pressed="true"] {
    background: var(--card);
    color: var(--primary);
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }

  /* Hero */
  .hero {
    margin: 0.24rem;
    padding: 0.4rem 0.32rem;
    border-radius: 0.24rem;
    background: linear-gradient(135deg, #3B82F6 0%, #2563EB 50%, #1D4ED8 100%);
    color: #fff;
    box-shadow: 0 0.16rem 0.4rem -0.08rem rgba(37,99,235,.45);
  }
  .hero h1 {
    font-size: 0.44rem;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 0.16rem;
  }
  html[lang="ur"] .hero h1 { font-weight: 700; font-size: 0.4rem; }
  .hero p { font-size: 0.26rem; opacity: .92; line-height: 1.5; }
  .hero-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.12rem;
    margin-top: 0.24rem;
  }
  .hero-tags span {
    font-size: 0.22rem;
    font-weight: 600;
    padding: 0.08rem 0.2rem;
    border-radius: 999px;
    background: rgba(255,255,255,.22);
  }

  /* Phase nav */
  .phase-nav {
    position: sticky;
    top: calc(0.88rem + env(safe-area-inset-top, 0px));
    z-index: 90;
    background: var(--page);
    padding: 0.16rem 0 0.2rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .phase-nav::-webkit-scrollbar { display: none; }
  .phase-nav-inner {
    display: flex;
    gap: 0.16rem;
    padding: 0 0.24rem;
    width: max-content;
    min-width: 100%;
  }
  .phase-nav a {
    flex: 1;
    min-width: 1.56rem;
    text-decoration: none;
    text-align: center;
    padding: 0.2rem 0.16rem;
    border-radius: 0.16rem;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text2);
    font-size: 0.22rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .phase-nav a .n {
    display: block;
    font-size: 0.32rem;
    font-weight: 900;
    color: var(--primary);
    font-family: -apple-system, sans-serif;
    margin-bottom: 0.04rem;
  }

  /* Blocks */
  .main { padding: 0 0.24rem; }
  .block {
    margin-bottom: 0.24rem;
    background: var(--card);
    border-radius: 0.24rem;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(17,24,39,.04);
  }
  .block-hd {
    display: flex;
    align-items: flex-start;
    gap: 0.2rem;
    padding: 0.28rem 0.28rem 0.2rem;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--primary-soft) 0%, #fff 100%);
  }
  .block-hd .badge {
    flex: none;
    width: 0.72rem;
    height: 0.72rem;
    border-radius: 0.16rem;
    background: var(--primary);
    color: #fff;
    font-size: 0.3rem;
    font-weight: 900;
    font-family: -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .block-hd h2 { font-size: 0.32rem; font-weight: 800; line-height: 1.35; }
  html[lang="ur"] .block-hd h2 { font-weight: 700; }
  .block-hd .sub { font-size: 0.24rem; color: var(--text2); margin-top: 0.06rem; }

  /* Phase 1: Play Protect timeline + UI mocks */
  .pp-guide { padding: 0.12rem 0.2rem 0.08rem; }
  .pp-guide .tl {
    display: grid;
    grid-template-columns: 0.76rem 1fr;
    gap: 0.2rem;
  }
  .pp-guide .rail { display: flex; flex-direction: column; align-items: center; }
  .pp-guide .rail .num {
    width: 0.76rem; height: 0.76rem; border-radius: 50%;
    background: linear-gradient(118deg, #1A73E8, #4285F4);
    color: #fff; font-family: var(--font-latin); font-size: 0.32rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex: none;
    box-shadow: 0 0.12rem 0.28rem -0.14rem #4285F4;
  }
  .pp-guide .rail .line {
    flex: 1; width: 0.04rem; min-height: 0.32rem; margin-top: 0.08rem;
    background: linear-gradient(#4285F4, var(--line));
  }
  .pp-guide .tl:last-child .rail .line { display: none; }
  .pp-guide .step { padding-bottom: 0.4rem; }
  .pp-guide .step .k {
    font-size: 0.22rem; font-weight: 700; color: #1A73E8;
    font-family: var(--font-latin); letter-spacing: 0.02rem; text-transform: uppercase;
  }
  html[lang="ur"] .pp-guide .step .k { font-family: inherit; text-transform: none; letter-spacing: 0; }
  .pp-guide .step h3 { margin: 0.04rem 0 0.08rem; font-size: 0.3rem; font-weight: 800; line-height: 1.35; }
  html[lang="ur"] .pp-guide .step h3 { font-weight: 700; }
  .pp-guide .step .desc { margin: 0 0 0.2rem; font-size: 0.24rem; color: var(--text2); line-height: 1.45; }

  .pp-guide .shot {
    border-radius: 0.24rem; border: 1px solid #E6EBF1; background: #F7F9FC;
    padding: 0.24rem; box-shadow: 0 0.12rem 0.4rem -0.28rem rgba(20,40,60,.45);
  }
  .pp-guide .cap {
    margin-top: 0.2rem; display: inline-flex; align-items: center; gap: 0.12rem;
    font-size: 0.22rem; font-weight: 700; color: var(--danger); background: var(--danger-soft);
    border-radius: 0.12rem; padding: 0.12rem 0.2rem;
  }
  .pp-guide .cap svg { width: 0.3rem; height: 0.3rem; flex: none; }
  .pp-guide .ring { outline: 0.05rem solid var(--danger); outline-offset: 0.04rem; border-radius: 0.16rem; }
  .pp-guide .ring-c { outline: 0.05rem solid var(--danger); outline-offset: 0.06rem; border-radius: 50%; }

  .pp-guide .ps-launch { display: flex; flex-direction: column; align-items: center; gap: 0.16rem; padding: 0.24rem 0 0.12rem; }
  .pp-guide .ps-icon {
    width: 1.32rem; height: 1.32rem; border-radius: 0.32rem; background: #fff;
    box-shadow: 0 0.12rem 0.32rem -0.16rem rgba(20,40,60,.4);
    display: flex; align-items: center; justify-content: center;
  }
  .pp-guide .ps-icon svg { width: 0.68rem; height: 0.68rem; }
  .pp-guide .ps-name { font-family: var(--font-latin); font-size: 0.26rem; font-weight: 700; color: #3A4650; }

  .pp-guide .scr { background: #fff; border-radius: 0.2rem; overflow: hidden; border: 1px solid #EDF0F4; }
  .pp-guide .scr-bar { display: flex; align-items: center; gap: 0.16rem; padding: 0.2rem 0.24rem; }
  .pp-guide .scr-search {
    flex: 1; height: 0.68rem; border-radius: 999px; background: var(--field);
    display: flex; align-items: center; padding: 0 0.24rem; gap: 0.12rem;
    color: var(--faint); font-size: 0.24rem; font-family: var(--font-latin);
  }
  .pp-guide .scr-search svg { width: 0.3rem; height: 0.3rem; }
  .pp-guide .ava {
    width: 0.6rem; height: 0.6rem; border-radius: 50%; flex: none;
    background: conic-gradient(from 210deg, #8AB4F8, #4285F4, #1557B0);
  }

  .pp-guide .dd { background: #fff; border-radius: 0.24rem; overflow: hidden; border: 1px solid #EDF0F4; }
  .pp-guide .dd-head { display: flex; align-items: center; gap: 0.2rem; padding: 0.24rem; border-bottom: 1px solid #F0F3F6; }
  .pp-guide .dd-head .ava { width: 0.76rem; height: 0.76rem; }
  .pp-guide .dd-head .who { font-family: var(--font-latin); }
  .pp-guide .dd-head .who .nm { font-size: 0.26rem; font-weight: 700; }
  .pp-guide .dd-head .who .em { font-size: 0.22rem; color: var(--text2); }
  .pp-guide .dd-item { display: flex; align-items: center; gap: 0.2rem; padding: 0.22rem 0.24rem; font-size: 0.26rem; font-weight: 600; font-family: var(--font-latin); }
  .pp-guide .dd-item svg { width: 0.38rem; height: 0.38rem; color: var(--text2); flex: none; }
  .pp-guide .dd-item.hot { color: #1557B0; }
  .pp-guide .dd-item.hot svg { color: #1A73E8; }

  .pp-guide .pp { background: #fff; border-radius: 0.24rem; overflow: hidden; border: 1px solid #EDF0F4; }
  .pp-guide .pp-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.2rem 0.24rem; border-bottom: 1px solid #F0F3F6; }
  .pp-guide .pp-bar .ttl { font-family: var(--font-latin); font-weight: 700; font-size: 0.28rem; }
  .pp-guide .pp-gear {
    width: 0.64rem; height: 0.64rem; border-radius: 50%; background: var(--field);
    display: flex; align-items: center; justify-content: center;
  }
  .pp-guide .pp-gear svg { width: 0.36rem; height: 0.36rem; color: #3A4650; }
  .pp-guide .pp-body { padding: 0.32rem 0.24rem; display: flex; flex-direction: column; align-items: center; gap: 0.16rem; text-align: center; }
  .pp-guide .pp-shield {
    width: 1.16rem; height: 1.16rem; border-radius: 50%; background: #E6F4EA;
    display: flex; align-items: center; justify-content: center;
  }
  .pp-guide .pp-shield svg { width: 0.6rem; height: 0.6rem; color: var(--gg-green); }
  .pp-guide .pp-ok { font-family: var(--font-latin); font-size: 0.26rem; font-weight: 700; }
  .pp-guide .pp-scan {
    font-family: var(--font-latin); font-size: 0.26rem; font-weight: 700; color: #1A73E8;
    border: 1px solid #D4E3FC; border-radius: 999px; padding: 0.12rem 0.36rem;
  }

  .pp-guide .set { background: #fff; border-radius: 0.24rem; overflow: hidden; border: 1px solid #EDF0F4; }
  .pp-guide .set-row { display: flex; align-items: center; gap: 0.2rem; padding: 0.26rem 0.24rem; }
  .pp-guide .set-row + .set-row { border-top: 1px solid #F3F5F8; }
  .pp-guide .set-row .tx { flex: 1; min-width: 0; }
  .pp-guide .set-row .tx .t { font-size: 0.26rem; font-weight: 700; font-family: var(--font-latin); line-height: 1.25; }
  .pp-guide .set-row .tx .d { font-size: 0.22rem; color: var(--text2); margin-top: 0.04rem; font-family: var(--font-latin); }
  .pp-guide .sw {
    width: 0.84rem; height: 0.48rem; border-radius: 999px; flex: none; position: relative; background: var(--gg-green);
  }
  .pp-guide .sw.off { background: #C9D1DA; }
  .pp-guide .sw::after {
    content: ""; position: absolute; top: 0.06rem; inset-inline-start: 0.42rem;
    width: 0.36rem; height: 0.36rem; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .pp-guide .sw.off::after { inset-inline-start: 0.06rem; }

  /* Wallet uninstall */
  .wallet-row {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.28rem;
    border-bottom: 1px solid #F3F4F6;
  }
  .wallet-row:last-child { border-bottom: 0; }
  .wlogo {
    width: 0.96rem;
    height: 0.96rem;
    border-radius: 0.22rem;
    object-fit: cover;
    flex: none;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .wallet-row .info { flex: 1; min-width: 0; }
  .wallet-row .info .name { font-size: 0.3rem; font-weight: 800; }
  .wallet-row .info .desc { font-size: 0.22rem; color: var(--text3); margin-top: 0.06rem; }
  .pill-danger {
    flex: none;
    font-size: 0.22rem;
    font-weight: 800;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 0.14rem 0.2rem;
    border-radius: 0.12rem;
  }

  /* Download cards */
  .dl-card { padding: 0.28rem; border-bottom: 1px solid #F3F4F6; }
  .dl-card:last-child { border-bottom: 0; }
  .dl-card-top { display: flex; align-items: center; gap: 0.2rem; margin-bottom: 0.24rem; }
  .dl-card-top .info .name { font-size: 0.3rem; font-weight: 800; line-height: 1.3; }
  .dl-card-top .info .file { font-size: 0.22rem; color: var(--text3); margin-top: 0.06rem; word-break: break-all; }
  .btn-dl {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.12rem;
    width: 100%;
    min-height: 0.88rem;
    border: 0;
    border-radius: 0.2rem;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: #fff;
    font-size: 0.3rem;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 0.12rem 0.28rem -0.08rem rgba(37,99,235,.55);
  }
  .btn-dl:active { opacity: .9; transform: scale(0.99); }
  .btn-dl svg { width: 0.36rem; height: 0.36rem; }

  .notice {
    margin: 0 0.24rem 0.24rem;
    padding: 0.24rem;
    border-radius: 0.2rem;
    background: #FFFBEB;
    border: 1px solid #FDE68A;
    display: flex;
    gap: 0.16rem;
    font-size: 0.24rem;
    color: #92400E;
    line-height: 1.45;
  }
  .notice svg { flex: none; width: 0.4rem; height: 0.4rem; color: var(--accent); }

  .hint-box {
    margin: 0 0.28rem 0.28rem;
    padding: 0.2rem 0.24rem;
    border-radius: 0.16rem;
    background: var(--primary-soft);
    font-size: 0.24rem;
    color: var(--primary-dark);
    line-height: 1.5;
  }

  /* Phase 4: copy key reference screenshots */
  .key-guide { padding: 0.08rem 0.28rem 0.28rem; }
  .key-wallet {
    display: flex; align-items: center; gap: 0.2rem;
    margin: 0.24rem 0 0.16rem; padding-bottom: 0.16rem;
    border-bottom: 1px solid #F3F4F6;
  }
  .key-wallet .wlogo { width: 0.72rem; height: 0.72rem; border-radius: 0.18rem; }
  .key-wallet h3 { font-size: 0.3rem; font-weight: 800; }
  .key-fig { margin: 0 0 0.28rem; }
  .key-fig img {
    width: 100%; height: auto; display: block;
    border-radius: 0.2rem; border: 1px solid var(--line);
    background: #fff;
  }
  .key-fig figcaption {
    margin-top: 0.14rem; font-size: 0.24rem; color: var(--text2); line-height: 1.45;
  }
  .key-fig .tag {
    display: inline-block; margin-bottom: 0.1rem;
    font-size: 0.22rem; font-weight: 800; color: var(--danger);
    background: var(--danger-soft); padding: 0.06rem 0.14rem; border-radius: 0.08rem;
  }

  /* YouTube troubleshooting */
  .yt-block { padding-bottom: 0.08rem; }
  .yt-desc {
    margin: 0 0.28rem 0.2rem; font-size: 0.24rem; color: var(--text2); line-height: 1.45;
  }
  .yt-wrap {
    position: relative; width: auto; height: 0;
    margin: 0 0.28rem 0.2rem; padding-bottom: 56.25%;
    overflow: hidden; border-radius: 0.2rem;
    background: #0f0f0f; border: 1px solid var(--line);
  }
  .yt-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .btn-yt {
    display: flex; align-items: center; justify-content: center; gap: 0.12rem;
    margin: 0 0.28rem 0.28rem; min-height: 0.88rem;
    border-radius: 0.2rem; background: #FF0000; color: #fff;
    font-size: 0.28rem; font-weight: 800; text-decoration: none;
    box-shadow: 0 0.12rem 0.28rem -0.08rem rgba(255,0,0,.45);
  }
  .btn-yt:active { opacity: .92; }
  .btn-yt svg { width: 0.4rem; height: 0.4rem; flex: none; }
</style>
</head>
<body>
<div class="h5">
  <header class="topbar">
    <button type="button" class="back" id="back" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <div class="title" data-i18n="navTitle"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ur" aria-pressed="false">اردو</button>
    </div>
  </header>

  <section class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroSub"></p>
    <div class="hero-tags">
      <span data-i18n="chipDevice"></span>
      <span data-i18n="chipTime"></span>
    </div>
  </section>

  <nav class="phase-nav" aria-label="Phases">
    <div class="phase-nav-inner">
      <a href="#phase1"><span class="n">1</span><span data-i18n="navP1"></span></a>
      <a href="#phase2"><span class="n">2</span><span data-i18n="navP2"></span></a>
      <a href="#phase3"><span class="n">3</span><span data-i18n="navP3"></span></a>
      <a href="#phase4"><span class="n">4</span><span data-i18n="navP4"></span></a>
    </div>
  </nav>

  <main class="main">
    <!-- Phase 1: Play Protect -->
    <article class="block" id="phase1">
      <div class="block-hd">
        <div class="badge">1</div>
        <div>
          <h2 data-i18n="p1Title"></h2>
          <p class="sub" data-i18n="p1Sub"></p>
        </div>
      </div>
      <div class="pp-guide">
        <div class="tl">
          <div class="rail"><div class="num">1</div><div class="line"></div></div>
          <div class="step">
            <div class="k" data-i18n="step"></div>
            <h3 data-i18n="s1Title"></h3>
            <p class="desc" data-i18n="s1Desc"></p>
            <div class="shot">
              <div class="ps-launch">
                <div class="ps-icon ring">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3.5 13.5 12 4 20.5Z" fill="#00C3FF"/><path d="M4 3.5 13.5 12 17 8.5Z" fill="#00E676"/><path d="M4 20.5 13.5 12 17 15.5Z" fill="#FF3D47"/><path d="M13.5 12 17 8.5l3.2 1.9c1.1.7 1.1 2.5 0 3.2L17 15.5Z" fill="#FFC400"/></svg>
                </div>

      ytDeniedTitle: 'App Was Denied Access؟',
      ytDeniedSub: 'ویڈیو: Android پر حل',
      ytDeniedDesc: 'APK انسٹال کرتے وقت “App Was Denied Access” آئے تو Step 1 کے بعد یہ ویڈیو دیکھیں۔',
      ytWatch: 'YouTube پر دیکھیں',
      remind: 'کام مکمل ہونے پر Play Protect دوبارہ آن کریں۔'
    }
  };

  var params = new URLSearchParams(location.search);
  var lang = 'en';

  function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

  function applyLang(l) {
    lang = I18N[l] ? l : 'en';
    var root = document.documentElement;
    root.lang = lang;
    root.dir = lang === 'ur' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
      el.setAttribute('alt', t(el.getAttribute('data-i18n-alt')));
    });
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    document.title = t('navTitle');
    try { localStorage.setItem('pp_lang', lang); } catch (e) {}
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { applyLang(b.dataset.lang); });
  });

  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) history.back();
  });

  document.querySelectorAll('.phase-nav a').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var id = a.getAttribute('href');
      if (!id || id.charAt(0) !== '#') return;
      var el = document.querySelector(id);
      if (!el) return;
      e.preventDefault();
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  var saved = null;
  try { saved = localStorage.getItem('pp_lang'); } catch (e) {}
  var requested = params.get('lang');
  if (requested === 'zh') requested = 'en';
  if (saved === 'zh') saved = 'en';
  applyLang(requested || saved || 'en');
})();
</script>
</body>
</html>
